---
# OSAC-3356: Validate a BMaaS snapshot flavor before publishing.
#
# Boots a cluster from the snapshot, runs the BMaaS E2E suite (bare metal
# provisioning), and reports pass/fail.  The build workflow gates publishing
# on this result.
name: Validate BMaaS Snapshot

on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: "Snapshot tag to validate (e.g. bmaas-4-22)"
        required: true
        type: string
      flavor_image:
        description: "Full OCI image (defaults to quay.io/osac-project/cluster-flavors:<tag>)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      snapshot_tag:
        description: "Snapshot tag to validate"
        required: true
        type: string
      flavor_image:
        description: "Full OCI image for the flavor"
        required: false
        type: string
        default: ""
    secrets:
      PULL_SECRET:
        required: true
    outputs:
      validation_passed:
        description: "Whether the BMaaS validation passed"
        value: ${{ jobs.validate.outputs.validation_passed }}

concurrency:
  group: "validate-bmaas-${{ inputs.snapshot_tag }}"
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate-snapshot.yaml
    with:
      snapshot_tag: ${{ inputs.snapshot_tag }}
      test_suite: bmaas
      cluster_name: validate-bmaas
      flavor_image: ${{ inputs.flavor_image }}
    secrets:
      PULL_SECRET: ${{ secrets.PULL_SECRET }}
